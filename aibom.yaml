# Ownership and context that code cannot tell a scanner. Read by the CS54 AI-BOM scanner (phase 2).
app: aibom-lab-support-chatbot
owner: customer-support-engineering (lab)
business_criticality: high
environment: lab
exposure: internet-facing        # intended deployment; the lab only runs on localhost
authentication: API key on both chat endpoints, per-client rate limit (phase 6, PB-05)
autonomy: advisory               # answers questions, takes no actions
data_classification:
  rag_corpus: reviewed public help articles only; hidden text stripped and contact details redacted at ingest (phase 6)
  user_input: untrusted
